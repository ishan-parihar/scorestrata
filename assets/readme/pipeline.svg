<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="190" viewBox="0 0 1200 190"
     role="img" aria-labelledby="title desc">
  <title id="title">Scorestrata compile pipeline</title>
  <desc id="desc">A brief flows through config generation, planning, compilation, and validation into a timeline IR, then the audio engine renders and masters a stereo WAV with recorded voices and per-layer FX.</desc>

  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1119"/>
      <stop offset="1" stop-color="#090C12"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="190" rx="24" fill="url(#pbg)"/>
  <rect x="1" y="1" width="1198" height="188" rx="23" fill="none" stroke="#1E2632" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">

    <!-- stage 1: brief -->
    <g transform="translate(56 56)">
      <rect x="0" y="0" width="128" height="78" rx="10" fill="#141A26" stroke="#2E3B4F"/>
      <text x="64" y="30" text-anchor="middle" font-size="15" letter-spacing="1" fill="#8FA0BD">BRIEF</text>
      <text x="64" y="52" text-anchor="middle" font-size="12" fill="#4E5E7A">plain language</text>
    </g>
    <path d="M 184 95 H 206" stroke="#2E3B4F" stroke-width="2" marker-end="url(#arr)"/>

    <!-- stage 2: config gen -->
    <g transform="translate(216 56)">
      <rect x="0" y="0" width="128" height="78" rx="10" fill="#141A26" stroke="#3A4B66"/>
      <text x="64" y="30" text-anchor="middle" font-size="15" letter-spacing="1" fill="#9FB0CF">CONFIG</text>
      <text x="64" y="52" text-anchor="middle" font-size="12" fill="#5A6C8C">genre + defaults</text>
    </g>
    <path d="M 344 95 H 366" stroke="#2E3B4F" stroke-width="2" marker-end="url(#arr)"/>

    <!-- stage 3: planner -->
    <g transform="translate(376 56)">
      <rect x="0" y="0" width="128" height="78" rx="10" fill="#141A26" stroke="#3A4B66"/>
      <text x="64" y="30" text-anchor="middle" font-size="15" letter-spacing="1" fill="#9FB0CF">PLANNER</text>
      <text x="64" y="52" text-anchor="middle" font-size="12" fill="#5A6C8C">segments · patterns</text>
    </g>
    <path d="M 504 95 H 526" stroke="#2E3B4F" stroke-width="2" marker-end="url(#arr)"/>

    <!-- stage 4: compiler -->
    <g transform="translate(536 56)">
      <rect x="0" y="0" width="128" height="78" rx="10" fill="#141A26" stroke="#F5A623" stroke-width="1.5"/>
      <text x="64" y="30" text-anchor="middle" font-size="15" letter-spacing="1" fill="#F5A623">COMPILER</text>
      <text x="64" y="52" text-anchor="middle" font-size="12" fill="#8A6A3E">deterministic events</text>
    </g>
    <path d="M 664 95 H 686" stroke="#2E3B4F" stroke-width="2" marker-end="url(#arr)"/>

    <!-- stage 5: timeline IR -->
    <g transform="translate(696 56)">
      <rect x="0" y="0" width="128" height="78" rx="10" fill="#141A26" stroke="#45D6C8" stroke-width="1.5"/>
      <text x="64" y="30" text-anchor="middle" font-size="15" letter-spacing="1" fill="#45D6C8">TIMELINE</text>
      <text x="64" y="52" text-anchor="middle" font-size="12" fill="#2E4E4A">auditable IR</text>
    </g>
    <path d="M 824 95 H 846" stroke="#2E3B4F" stroke-width="2" marker-end="url(#arr)"/>

    <!-- stage 6: audio -->
    <g transform="translate(856 56)">
      <rect x="0" y="0" width="128" height="78" rx="10" fill="#141A26" stroke="#45D6C8" stroke-width="1.5"/>
      <text x="64" y="30" text-anchor="middle" font-size="15" letter-spacing="1" fill="#45D6C8">AUDIO</text>
      <text x="64" y="52" text-anchor="middle" font-size="12" fill="#2E4E4A">voices · FX · automation</text>
    </g>
    <path d="M 984 95 H 1006" stroke="#2E3B4F" stroke-width="2" marker-end="url(#arr)"/>

    <!-- stage 7: mastered wav -->
    <g transform="translate(1016 56)">
      <rect x="0" y="0" width="128" height="78" rx="10" fill="#F5A623"/>
      <text x="64" y="30" text-anchor="middle" font-size="15" letter-spacing="1" fill="#1A1206">WAV</text>
      <text x="64" y="52" text-anchor="middle" font-size="12" fill="#7A5312">mastered stereo</text>
    </g>

    <!-- guarantees bar -->
    <g transform="translate(56 156)">
      <text x="0" y="0" font-size="14" fill="#6E7889">byte-identical output</text>
      <circle cx="206" cy="-4" r="3" fill="#2E3B4F"/>
      <text x="220" y="0" font-size="14" fill="#6E7889">recorded SF2 voices</text>
      <circle cx="420" cy="-4" r="3" fill="#2E3B4F"/>
      <text x="434" y="0" font-size="14" fill="#6E7889">round-robin takes</text>
      <circle cx="624" cy="-4" r="3" fill="#2E3B4F"/>
      <text x="638" y="0" font-size="14" fill="#6E7889">per-layer FX + automation</text>
      <circle cx="880" cy="-4" r="3" fill="#2E3B4F"/>
      <text x="894" y="0" font-size="14" fill="#6E7889">LUFS-targeted master</text>
    </g>
  </g>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E3B4F"/>
    </marker>
  </defs>
</svg>
