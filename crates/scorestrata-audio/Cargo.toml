[package]
name = "scorestrata-audio"
description = "Audio engine: instruments, FX, mixer, offline render, stems"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
scorestrata-core = { path = "../scorestrata-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true

# Post-generation spectral audit (§2 of the audio-quality plan):
# rustfft for the STFT analysis, plotters (bitmap backend only, no font/svg
# deps) for the spectrogram + waveform PNG debug logs.
rustfft = "6"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series"] }

# Real-instrument synthesis infrastructure (Phase G): hound for robust WAV
# loading of the embedded sample bank, rubato for high-quality fractional
# pitch-shifting of multi-sample instruments (and the plan's future 96 kHz
# SRC mode). Both pure-Rust (R7).
hound = "3.5"
rubato = "0.15"

# Production-grade instrument source (Phase H): rustysynth (MIT, pure Rust)
# renders SoundFont .sf2 files — recorded multi-sampled instruments — into
# the deterministic one-shot bank. Build-time only: the `extract_sf2` bin
# needs it, the runtime engine never touches it (the extracted WAVs are
# committed, so the SF2 itself stays out of the binary).
rustysynth = "1.3"

[lints]
workspace = true
